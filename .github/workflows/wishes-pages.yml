# The Wishes builder page on GitHub Pages of w0ts/dn2-wishes (https://w0ts.github.io/dn2-wishes/, also builder.html).
#
# Runs on every push to main, like the other w0ts sites (2026-11-24), and by hand from the Actions tab. Nothing here builds firmware or
# reads Elektron's files: the page builds in the user's browser from their own. What it publishes is
# wishes/ on the branch it runs on (scripts/web_bundle.py --wishes writes it locally: wishes.json, one
# code zip per cleared preset, the published gate records), plus the page's own files, and the sample
# import page beside it (tools/web/index.html published as samples.html, with its manifest and icons), the help, the
# presets and the About page (scripts/make_site.sh lays the whole site out; it is also what a local preview uses).
#
# It refuses to publish unless every LISTED file has a gate record that clears it and every zip is the
# one listed (scripts/web_bundle.py --check-site); an empty list is allowed (the builder then says "No release
# published yet"). An --uncleared-test bundle ("gate": null) never passes.
# A repository has one Pages site: upstream's pages.yml (site/) stays manual and is not run here.
name: wishes-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wishes-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'w0ts/dn2-wishes'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: only cleared files
        run: python scripts/web_bundle.py --check-site wishes
      - name: the site
        run: bash scripts/make_site.sh _site
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
